    <header class="header container">
      <h1 class="hero">&lt;/HTML&gt;</h1>
      <p class="hero-title">закрывающий тег</p>

    <main class="yes">
      <article class="container memory-piece article-container">
        <h2 class="article__title">
          Фритрек и нулевой спринт: Подготовка к работе
        </h2>
        <img
          src="./images/z_sprint.jpg"
          alt="пиксельный фургончик. красивый"
          class="memory-piece__image"
        />
        <div class="sheet">
          <p class="memory-piece__description">
            Это было самое начало пути. На этом этапе важно было проникнуться
            основами и настроиться на учёбу. И, возможно, подумать, как новые
            знания могут повлиять на ваше будущее.
          </p>
          <p class="memory-piece__description">
            Место для ваших воспоминаний о начале обучения.
          </p>
